<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Resonance</title>
<style>
:root{
  --crust:#11111b; --mantle:#181825; --base:#1e1e2e; --s0:#313244; --s1:#45475a;
  --text:#cdd6f4; --dim:#a6adc8; --ac:#cba6f7;
  --font:"Inter","SF Pro Display",-apple-system,"Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--crust);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased;overflow:hidden;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
::-webkit-scrollbar{width:10px}::-webkit-scrollbar-thumb{background:var(--s0);border-radius:6px;border:2px solid transparent;background-clip:content-box}

.shell{display:grid;grid-template-columns:232px 1fr 360px;grid-template-rows:1fr 88px;gap:8px;padding:8px;height:100vh}
.panel{background:var(--mantle);border-radius:12px;overflow:hidden;min-height:0}

.side{padding:20px 12px;display:flex;flex-direction:column;gap:4px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;letter-spacing:-.02em;padding:0 12px 18px}
.logo i{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--ac),#89b4fa);display:block}
.nav{display:flex;align-items:center;gap:14px;padding:10px 12px;border-radius:8px;color:var(--dim);font-weight:600;width:100%;text-align:left;transition:color .15s,background .15s}
.nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav:hover{color:var(--text)}
.nav.on{color:var(--text);background:var(--s0)}
.sp{flex:1}
.src{font-size:12px;color:var(--dim);padding:10px 12px;line-height:1.45}

.main{display:flex;flex-direction:column;background:linear-gradient(180deg,#2a2640 0,var(--mantle) 280px)}
.top{padding:16px 24px 8px}
.sbox{display:flex;align-items:center;gap:10px;background:var(--s0);border-radius:999px;height:44px;padding:0 18px;max-width:440px;border:2px solid transparent;transition:border-color .15s}
.sbox:focus-within{border-color:var(--text)}
.sbox svg{width:18px;height:18px;stroke:var(--dim);fill:none;stroke-width:2.2;stroke-linecap:round;flex:none}
.sbox input{flex:1;background:none;border:0;outline:0;font-size:15px;user-select:text}
.sbox input::placeholder{color:var(--dim)}
.body{flex:1;overflow-y:auto;padding:8px 16px 24px}
h2{font-size:26px;font-weight:800;letter-spacing:-.02em;padding:14px 8px 10px}
.head{display:grid;grid-template-columns:40px 1fr 90px;gap:14px;padding:6px 12px;color:var(--dim);font-size:12px;border-bottom:1px solid var(--s0);margin-bottom:6px}
.row{display:grid;grid-template-columns:40px 1fr 90px;gap:14px;align-items:center;padding:6px 12px;border-radius:8px;width:100%;text-align:left}
.row:hover{background:rgba(255,255,255,.07)}
.row.on .t{color:var(--ac)}
.cov{width:40px;height:40px;border-radius:4px;object-fit:cover;background:var(--s0);display:block}
.t{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.a{font-size:13px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.yt{font-size:11px;color:var(--dim);display:flex;align-items:center;gap:5px;justify-content:flex-end}
.yt:before{content:"";width:12px;height:9px;border-radius:3px;background:#ff3b3b;display:block}
.like{width:28px;height:28px;display:grid;place-items:center;border-radius:50%;color:var(--dim)}
.like svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2}
.like.on{color:var(--ac)}.like.on svg{fill:currentColor}
.msg{padding:40px 12px;color:var(--dim);line-height:1.6;max-width:560px}
.card{margin:12px 8px;padding:24px;background:var(--base);border-radius:14px;max-width:560px;line-height:1.6;user-select:text}
.card h3{font-size:20px;margin-bottom:8px}
.card ol{padding-left:20px;color:var(--dim);margin:10px 0 16px}
.card input.k{width:100%;height:42px;border-radius:8px;border:1px solid var(--s1);background:var(--mantle);padding:0 12px;outline:0;margin-bottom:12px}
.btn{background:var(--ac);color:var(--crust);font-weight:700;border-radius:999px;padding:10px 22px}
.btn:hover{filter:brightness(1.08)}
.sw{display:flex;gap:10px;margin:10px 0 18px}.sw button{width:30px;height:30px;border-radius:50%;border:2px solid transparent}.sw button.on{border-color:var(--text)}

.right{display:flex;flex-direction:column;padding:16px;gap:14px;background:var(--base)}
.vid{aspect-ratio:16/10;width:100%;border-radius:10px;overflow:hidden;background:#000;flex:none}
.vid iframe{width:100%;height:100%;display:block}
.now .nt{font-size:18px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now .na{font-size:14px;color:var(--dim);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lh{display:flex;align-items:center;justify-content:space-between;font-weight:700}
.off{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--dim);font-weight:500}
.off button{width:24px;height:24px;border-radius:6px;background:var(--s0)}
.lyr{flex:1;overflow-y:auto;min-height:0;background:linear-gradient(160deg,var(--ac),#6c5ce7);background:color-mix(in srgb,var(--ac) 38%,var(--base));border-radius:12px;padding:16px 18px;user-select:text}
.ln{font-size:20px;font-weight:700;line-height:1.3;padding:6px 0;color:rgba(255,255,255,.42);cursor:pointer;transition:color .25s}
.ln:hover{color:rgba(255,255,255,.75)}
.ln.cur{color:#fff}
.ln.plain{font-size:15px;font-weight:600;color:rgba(255,255,255,.88);cursor:default;padding:3px 0}
.lyr .msg{padding:0;color:rgba(255,255,255,.8)}

.bar{grid-column:1/-1;display:grid;grid-template-columns:1fr minmax(0,620px) 1fr;align-items:center;gap:16px;padding:0 16px;background:transparent}
.bl{display:flex;align-items:center;gap:12px;min-width:0}
.bl .cov{width:56px;height:56px;border-radius:6px}
.bc{display:flex;flex-direction:column;align-items:center;gap:6px}
.ctl{display:flex;align-items:center;gap:14px}
.ic{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;color:var(--dim);transition:color .15s,transform .1s}
.ic:hover{color:var(--text)}.ic:active{transform:scale(.92)}
.ic.on{color:var(--ac)}
.ic svg{width:20px;height:20px;fill:currentColor}
.ic.st svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pp{width:38px;height:38px;background:var(--text);color:var(--crust)}.pp:hover{color:var(--crust);transform:scale(1.06)}
.pp svg{width:18px;height:18px}
.tl{display:flex;align-items:center;gap:10px;width:100%;font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}
.tl span{width:36px;text-align:center}
.br{display:flex;align-items:center;justify-content:flex-end;gap:8px}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:4px;border-radius:2px;background:linear-gradient(to right,var(--text) var(--p,0%),var(--s1) var(--p,0%));outline:0;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:0;height:0;border-radius:50%;background:#fff}
input[type=range]:hover{background:linear-gradient(to right,var(--ac) var(--p,0%),var(--s1) var(--p,0%))}
input[type=range]:hover::-webkit-slider-thumb{width:12px;height:12px}
.vol{flex:none;width:100px}
</style>
</head>
<body>
<div class="shell">
  <nav class="panel side">
    <div class="logo"><i></i>Resonance</div>
    <button class="nav on" data-v="home"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>Поиск</button>
    <button class="nav" data-v="liked"><svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-9-9a5 5 0 0 1 9-3 5 5 0 0 1 9 3c-2 4.6-9 9-9 9z"/></svg>Понравившиеся</button>
    <button class="nav" data-v="recent"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Недавние</button>
    <div class="sp"></div>
    <button class="nav" data-v="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.5-2-3.4-2.3.9a7 7 0 0 0-2-1.2L14.2 3h-4l-.4 2.6a7 7 0 0 0-2 1.2l-2.3-.9-2 3.4 2 1.5a7 7 0 0 0 0 2.4l-2 1.5 2 3.4 2.3-.9a7 7 0 0 0 2 1.2l.4 2.6h4l.4-2.6a7 7 0 0 0 2-1.2l2.3.9 2-3.4-2-1.5c.1-.4.1-.8.1-1.2z"/></svg>Настройки</button>
    <div class="src">Музыка воспроизводится через официальный плеер YouTube. Тексты — LRCLIB.</div>
  </nav>

  <section class="panel main">
    <div class="top"><label class="sbox"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="text" placeholder="Что хотите послушать?" autocomplete="off" spellcheck="false"></label></div>
    <div class="body" id="body"></div>
  </section>

  <aside class="panel right">
    <div class="vid"><div id="yt"></div></div>
    <div class="now"><div class="nt" id="nt">Ничего не играет</div><div class="na" id="na">Найдите трек в поиске</div></div>
    <div class="lh">Текст песни<div class="off"><button id="offm" title="Текст раньше">−</button><span id="offv">0.0с</span><button id="offp" title="Текст позже">+</button></div></div>
    <div class="lyr" id="lyr"><div class="msg">Здесь появится текст.</div></div>
  </aside>

  <footer class="bar">
    <div class="bl"><img class="cov" id="bc" alt="" hidden><div style="min-width:0"><div class="t" id="bt"></div><div class="a" id="ba"></div></div><button class="like" id="bLike" aria-label="В избранное" hidden></button></div>
    <div class="bc">
      <div class="ctl">
        <button class="ic st" id="shuf" aria-label="Перемешать"><svg viewBox="0 0 24 24"><path d="M3 6h3.5a5 5 0 0 1 4 2l5 8a5 5 0 0 0 4 2H21M3 18h3.5a5 5 0 0 0 4-2M15.5 8a5 5 0 0 1 4-2H21M18 3l3 3-3 3M18 15l3 3-3 3"/></svg></button>
        <button class="ic" id="prev" aria-label="Назад"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
        <button class="ic pp" id="play" aria-label="Играть/пауза"></button>
        <button class="ic" id="next" aria-label="Вперёд"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
        <button class="ic st" id="rep" aria-label="Повтор"><svg viewBox="0 0 24 24"><path d="M17 2l4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 0 1-3 3H3"/></svg></button>
      </div>
      <div class="tl"><span id="cur">0:00</span><input type="range" id="seek" min="0" max="1000" value="0" aria-label="Перемотка"><span id="dur">0:00</span></div>
    </div>
    <div class="br"><svg width="18" height="18" viewBox="0 0 24 24" fill="var(--dim)"><path d="M3 9v6h4l5 4V5L7 9zM16 8a5 5 0 0 1 0 8"/></svg><input type="range" class="vol" id="vol" min="0" max="100" value="80" aria-label="Громкость"></div>
  </footer>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dec = s => { const t = document.createElement('textarea'); t.innerHTML = s; return t.value; };
const fmt = s => isFinite(s) && s > 0 ? Math.floor(s/60) + ':' + String(Math.floor(s%60)).padStart(2,'0') : '0:00';
const store = { get:(k,d) => { try{ return JSON.parse(localStorage.getItem(k)) ?? d; }catch{ return d; } }, set:(k,v) => { try{ localStorage.setItem(k, JSON.stringify(v)); }catch{} } };
const ICON = { play:'<svg viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></svg>', pause:'<svg viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>',
  heart:'<svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-9-9a5 5 0 0 1 9-3 5 5 0 0 1 9 3c-2 4.6-9 9-9 9z"/></svg>' };
const ACCENTS = { 'Мальва':'#cba6f7', 'Мята':'#a6e3a1', 'Роза':'#f38ba8', 'Небо':'#89b4fa', 'Персик':'#fab387' };

let S = { key:store.get('key',''), accent:store.get('accent','#cba6f7'), liked:store.get('liked',[]), recent:store.get('recent',[]),
  view:'home', list:[], queue:[], qi:-1, cur:null, shuffle:false, repeat:0, off:0 };
document.documentElement.style.setProperty('--ac', S.accent);
$('#play').innerHTML = ICON.play; $('#bLike').innerHTML = ICON.heart;

let yt, ytReady = false, pending = null;
const sc = document.createElement('script'); sc.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(sc);
window.onYouTubeIframeAPIReady = () => {
  yt = new YT.Player('yt', { width:'100%', height:'100%', playerVars:{ playsinline:1, rel:0, controls:0, disablekb:1, modestbranding:1, origin:location.origin },
    events:{ onReady:() => { ytReady = true; yt.setVolume(+$('#vol').value); if(pending) yt.loadVideoById(pending); },
      onStateChange:e => { if(e.data === 1) setPlaying(true); if(e.data === 2) setPlaying(false); if(e.data === 0) ended(); },
      onError:() => next(true) } });
};
const setPlaying = p => { $('#play').innerHTML = p ? ICON.pause : ICON.play; };

async function search(q){
  if(!S.key) return renderView();
  $('#body').innerHTML = '<div class="msg">Ищу…</div>';
  try{
    const u = `https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&videoCategoryId=10&videoEmbeddable=true&maxResults=25&q=${encodeURIComponent(q)}&key=${S.key}`;
    const j = await (await fetch(u)).json();
    if(j.error) throw new Error(j.error.message);
    S.list = j.items.map(it => parse(it.id.videoId, dec(it.snippet.title), dec(it.snippet.channelTitle), it.snippet.thumbnails));
    S.view = 'home'; renderView(true);
  }catch(e){ $('#body').innerHTML = `<div class="msg">Не удалось выполнить поиск: ${esc(e.message)}<br>Проверьте ключ в настройках.</div>`; }
}
function parse(id, title, channel, th){
  const clean = title.replace(/[\(\[][^\)\]]*(official|video|audio|lyric|visuali[sz]er|hd|4k|remaster|клип|премьера)[^\)\]]*[\)\]]/gi,'').replace(/\s{2,}/g,' ').trim();
  let artist = channel.replace(/\s*-\s*Topic$/i,'').replace(/VEVO$/i,''), name = clean;
  const m = clean.split(/\s[-–—]\s/); if(m.length >= 2){ artist = m[0].trim(); name = m.slice(1).join(' - ').trim(); }
  return { id, title:name, artist, raw:title, cover:(th.medium || th.default || {}).url || '' };
}
let timer; $('#q').addEventListener('input', e => { clearTimeout(timer); const v = e.target.value.trim(); timer = setTimeout(() => v ? search(v) : (S.view='home', renderView()), 450); });

const isLiked = t => S.liked.some(x => x.id === t.id);
function rows(arr){
  if(!arr.length) return '';
  return `<div class="head"><span></span><span>Название</span><span style="text-align:right">Источник</span></div>` + arr.map((t,i) => `
    <div class="row ${S.cur && S.cur.id===t.id ? 'on':''}" data-i="${i}" data-id="${t.id}" role="button" tabindex="0">
      <img class="cov" loading="lazy" src="${esc(t.cover)}" alt="">
      <div style="min-width:0"><div class="t">${esc(t.title)}</div><div class="a">${esc(t.artist)}</div></div>
      <div class="yt">YouTube</div>
    </div>`).join('');
}
function renderView(fromSearch){
  const b = $('#body');
  document.querySelectorAll('.nav').forEach(n => n.classList.toggle('on', n.dataset.v === S.view));
  if(S.view === 'settings'){
    b.innerHTML = `<h2>Настройки</h2><div class="card"><h3>Ключ YouTube Data API</h3>
      <input class="k" id="key" type="text" placeholder="AIza…" value="${esc(S.key)}" spellcheck="false">
      <button class="btn" id="saveKey">Сохранить</button>
      <h3 style="margin-top:22px">Цвет акцента</h3><div class="sw">${Object.entries(ACCENTS).map(([n,c]) => `<button title="${n}" data-c="${c}" class="${c===S.accent?'on':''}" style="background:${c}"></button>`).join('')}</div></div>`;
    return;
  }
  if(!S.key){
    b.innerHTML = `<h2>Добро пожаловать</h2><div class="card"><h3>Нужен бесплатный ключ YouTube</h3>
      Поиск работает через официальный YouTube Data API (около 100 поисков в день бесплатно).
      <ol><li>Откройте console.cloud.google.com и создайте проект</li><li>Включите «YouTube Data API v3»</li><li>Credentials → Create credentials → API key</li></ol>
      <input class="k" id="key" type="text" placeholder="Вставьте ключ AIza…" spellcheck="false"><button class="btn" id="saveKey">Начать</button></div>`;
    return;
  }
  let arr, title;
  if(S.view === 'liked'){ arr = S.liked; title = 'Понравившиеся'; }
  else if(S.view === 'recent'){ arr = S.recent; title = 'Недавние'; }
  else { arr = S.list; title = fromSearch ? 'Результаты' : 'Поиск'; }
  S.show = arr;
  b.innerHTML = `<h2>${title}</h2>` + (arr.length ? rows(arr) : `<div class="msg">${S.view==='home' ? 'Введите название песни или артиста.' : 'Здесь пока пусто.'}</div>`);
}
$('#body').addEventListener('click', e => {
  if(e.target.id === 'saveKey'){ S.key = $('#key').value.trim(); store.set('key', S.key); S.view = 'home'; renderView(); return; }
  const sw = e.target.closest('[data-c]'); if(sw){ S.accent = sw.dataset.c; store.set('accent', S.accent); document.documentElement.style.setProperty('--ac', S.accent); renderView(); return; }
  const r = e.target.closest('.row'); if(r){ S.queue = S.show.slice(); S.qi = +r.dataset.i; start(S.queue[S.qi]); }
});
document.querySelectorAll('.nav').forEach(n => n.onclick = () => { S.view = n.dataset.v; renderView(); });

function start(t){
  S.cur = t; S.off = 0; $('#offv').textContent = '0.0с';
  if(ytReady) yt.loadVideoById(t.id); else pending = t.id;
  $('#bc').hidden = $('#bLike').hidden = false; $('#bc').src = t.cover;
  $('#bt').textContent = $('#nt').textContent = t.title; $('#ba').textContent = $('#na').textContent = t.artist;
  document.title = `${t.title} — ${t.artist}`;
  S.recent = [t, ...S.recent.filter(x => x.id !== t.id)].slice(0, 40); store.set('recent', S.recent);
  document.querySelectorAll('.row').forEach(r => r.classList.toggle('on', r.dataset.id === t.id));
  syncLike(); loadLyrics(t);
}
function next(auto){
  if(!S.queue.length) return;
  if(S.shuffle) S.qi = Math.floor(Math.random() * S.queue.length);
  else if(S.qi + 1 < S.queue.length) S.qi++;
  else if(S.repeat === 1 || !auto) S.qi = 0; else return;
  start(S.queue[S.qi]);
}
function prev(){ if(!S.queue.length) return; if(ytReady && yt.getCurrentTime() > 3) return yt.seekTo(0); S.qi = (S.qi - 1 + S.queue.length) % S.queue.length; start(S.queue[S.qi]); }
function ended(){ if(S.repeat === 2){ yt.seekTo(0); yt.playVideo(); } else next(true); }
const toggle = () => { if(!ytReady || !S.cur) return; yt.getPlayerState() === 1 ? yt.pauseVideo() : yt.playVideo(); };
$('#play').onclick = toggle; $('#next').onclick = () => next(false); $('#prev').onclick = prev;
$('#shuf').onclick = () => { S.shuffle = !S.shuffle; $('#shuf').classList.toggle('on', S.shuffle); };
$('#rep').onclick = () => { S.repeat = (S.repeat + 1) % 3; $('#rep').classList.toggle('on', S.repeat > 0); $('#rep').title = ['Повтор выкл.','Повтор списка','Повтор трека'][S.repeat]; };
$('#vol').addEventListener('input', e => { e.target.style.setProperty('--p', e.target.value + '%'); if(ytReady) yt.setVolume(+e.target.value); });
$('#vol').style.setProperty('--p', '80%');
function syncLike(){ if(S.cur) $('#bLike').classList.toggle('on', isLiked(S.cur)); }
$('#bLike').onclick = () => { if(!S.cur) return; S.liked = isLiked(S.cur) ? S.liked.filter(x => x.id !== S.cur.id) : [S.cur, ...S.liked]; store.set('liked', S.liked); syncLike(); if(S.view === 'liked') renderView(); };

let seeking = false;
$('#seek').addEventListener('input', e => { seeking = true; e.target.style.setProperty('--p', e.target.value/10 + '%'); });
$('#seek').addEventListener('change', e => { if(ytReady) yt.seekTo(e.target.value/1000 * yt.getDuration(), true); seeking = false; });
setInterval(() => {
  if(!ytReady || !S.cur || !yt.getCurrentTime) return;
  const c = yt.getCurrentTime(), d = yt.getDuration() || 0, p = d ? c/d*100 : 0;
  $('#cur').textContent = fmt(c); $('#dur').textContent = fmt(d);
  if(!seeking){ $('#seek').value = p*10; $('#seek').style.setProperty('--p', p + '%'); }
  syncLyrics(c);
}, 250);

addEventListener('keydown', e => {
  if(e.target.tagName === 'INPUT') return;
  if(e.code === 'Space'){ e.preventDefault(); toggle(); }
  if(e.code === 'ArrowRight' && e.shiftKey) next(false);
  if(e.code === 'ArrowLeft' && e.shiftKey) prev();
});

let lines = [], synced = false, curLine = -1, token = 0;
async function loadLyrics(t){
  const my = ++token; lines = []; curLine = -1;
  $('#lyr').innerHTML = '<div class="msg">Ищу текст…</div>';
  const get = async u => { try{ return await (await fetch(u)).json(); }catch{ return []; } };
  const base = 'https://lrclib.net/api/search?';
  let res = await get(`${base}track_name=${encodeURIComponent(t.title)}&artist_name=${encodeURIComponent(t.artist)}`);
  if(!res.length) res = await get(`${base}q=${encodeURIComponent(t.artist + ' ' + t.title)}`);
  if(my !== token) return;
  const hit = res.find(r => r.syncedLyrics) || res.find(r => r.plainLyrics);
  if(!hit){ $('#lyr').innerHTML = '<div class="msg">Для этого трека текста нет.</div>'; return; }
  if(hit.syncedLyrics){
    synced = true;
    lines = hit.syncedLyrics.split('\n').map(l => { const m = l.match(/\[(\d+):(\d+(?:\.\d+)?)\]\s*(.*)/); return m && { t:+m[1]*60 + +m[2], s:m[3] }; }).filter(Boolean);
    $('#lyr').innerHTML = lines.map((l,i) => `<div class="ln" data-i="${i}">${esc(l.s) || '♪'}</div>`).join('');
  } else {
    synced = false;
    $('#lyr').innerHTML = hit.plainLyrics.split('\n').map(l => `<div class="ln plain">${esc(l) || '&nbsp;'}</div>`).join('');
  }
}
$('#lyr').addEventListener('click', e => { const l = e.target.closest('.ln[data-i]'); if(l && ytReady) yt.seekTo(lines[+l.dataset.i].t - S.off, true); });
function syncLyrics(c){
  if(!synced || !lines.length) return;
  c += S.off; let i = -1;
  for(let k = 0; k < lines.length; k++){ if(lines[k].t <= c + .2) i = k; else break; }
  if(i === curLine) return; curLine = i;
  const box = $('#lyr'); box.querySelectorAll('.cur').forEach(x => x.classList.remove('cur'));
  const el = box.querySelector(`[data-i="${i}"]`); if(!el) return;
  el.classList.add('cur');
  box.scrollTo({ top: el.offsetTop - box.clientHeight/2 + el.clientHeight/2, behavior:'smooth' });
}
const bump = d => { S.off = Math.round((S.off + d) * 10) / 10; $('#offv').textContent = (S.off > 0 ? '+' : '') + S.off.toFixed(1) + 'с'; curLine = -1; };
$('#offm').onclick = () => bump(-.5); $('#offp').onclick = () => bump(.5);

renderView();
</script>
</body>
